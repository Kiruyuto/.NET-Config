name: "CI"

on:
  pull_request:
    types: ["opened", "reopened", "synchronize", "ready_for_review"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions: {}

jobs:
  config:
    runs-on: ["ubuntu-latest"]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: "global.json"

      - name: "Pack"
        run: dotnet pack Kiruyuto.DotNet.Config/Kiruyuto.DotNet.Config.csproj -c Release -o . -p:PackageVersion=0.0.1

      - name: "Build consumer project"
        shell: bash
        env:
          CONSUMER_DIR: "${{ runner.temp }}/dotnet-config-consumer"
          CONSUMER_PROJECT: "${{ runner.temp }}/dotnet-config-consumer/ConfigConsumer.csproj"
        run: |
          dotnet new console --name ConfigConsumer --framework net11.0 --output "$CONSUMER_DIR" --no-restore
          dotnet add "$CONSUMER_PROJECT" package Kiruyuto.DotNet.Config --version 0.0.1 --no-restore
          dotnet restore "$CONSUMER_PROJECT" --source "$GITHUB_WORKSPACE" --source https://api.nuget.org/v3/index.json
          dotnet build "$CONSUMER_PROJECT" --configuration Release --no-restore
